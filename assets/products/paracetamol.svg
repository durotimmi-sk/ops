<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Box and blister pack of paracetamol 500 mg tablets">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7f6"/>
      <stop offset="0.6" stop-color="#efeeec"/>
      <stop offset="1" stop-color="#e4e2df"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f1f3f6"/>
      <stop offset="1" stop-color="#d9e0e8"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aebbc9"/>
      <stop offset="1" stop-color="#d5dee8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#456a91"/>
      <stop offset="1" stop-color="#274968"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f7f5"/>
      <stop offset="0.5" stop-color="#cfd3d5"/>
      <stop offset="1" stop-color="#eef0f0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feColorMatrix type="matrix" values="0 0 0 0 0.08 0 0 0 0 0.08 0 0 0 0 0.08 0 0 0 0.2 0"/>
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="650" cy="120" r="180" fill="#ffffff" opacity="0.55"/>
  <circle cx="100" cy="520" r="210" fill="#ffffff" opacity="0.4"/>
  <ellipse cx="410" cy="490" rx="250" ry="42" fill="#111111" opacity="0.14" filter="url(#shadow)"/>

  <g transform="rotate(-5 400 330)">
    <path d="M206 188h382l38 46v202l-46 44H206z" fill="url(#side)"/>
    <rect x="176" y="158" width="420" height="258" rx="16" fill="url(#box)"/>
    <rect x="176" y="158" width="420" height="258" rx="16" fill="#ffffff" opacity="0.35"/>
    <rect x="176" y="158" width="420" height="102" rx="16" fill="url(#blue)"/>
    <path d="M176 242h420v18H176z" fill="#ffffff" opacity="0.18"/>

    <text x="208" y="202" fill="#dceaf9" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">MEDWAY DIRECT</text>
    <text x="208" y="242" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-1">PARACETAMOL</text>
    <text x="210" y="280" fill="#3b5f80" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="1">500 mg · 1,000 tablets</text>

    <g transform="translate(450 282) rotate(-8)">
      <rect x="0" y="0" width="118" height="154" rx="8" fill="url(#foil)" stroke="#b8c0c4" stroke-width="2"/>
      <g fill="#ffffff" stroke="#aeb7bb" stroke-width="1.5">
        <circle cx="30" cy="30" r="11"/><circle cx="59" cy="30" r="11"/><circle cx="88" cy="30" r="11"/>
        <circle cx="30" cy="60" r="11"/><circle cx="59" cy="60" r="11"/><circle cx="88" cy="60" r="11"/>
        <circle cx="30" cy="90" r="11"/><circle cx="59" cy="90" r="11"/><circle cx="88" cy="90" r="11"/>
        <circle cx="30" cy="120" r="11"/><circle cx="59" cy="120" r="11"/><circle cx="88" cy="120" r="11"/>
      </g>
    </g>

    <rect x="208" y="338" width="170" height="42" rx="21" fill="#ffffff" opacity="0.6"/>
    <text x="223" y="365" fill="#33536f" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">1,000 TABLETS / BOX</text>
    <text x="208" y="402" fill="#71808e" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1">BLISTER PACKED · GMP · FDA REGISTERED</text>
  </g>
  <text x="48" y="552" fill="#787a7c" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1">PARACETAMOL 500 MG · 500 BOXES</text>
</svg>
